[AutoDJ]

[Library]
AutoDjAddBottom Alt+-
AutoDjAddTop Alt+=
font_size_decrement Alt+'
font_size_increment Alt+Shift+"

[PreviewDeck1]

[Master]
gain_down Ctrl+-
gain_up Ctrl+=
headMix_down -
headMix_up =
headGain_down Shift+_
headGain_up Shift++

[Auxiliary1]

[Microphone]
talkover Space
pfl Ctrl+Shift+Y
volume_down Alt+[
volume_up Alt+]
volume_set_default Alt+\

[Microphone2]

[Channel1]
LoadSelectedTrack Shift+Left

play z
cue_default x

fwd q
back Shift+q
beatjump_0.03125_forward ctrl+q
beatjump_0.03125_backward ctrl+Shift+q
beatjump_4_forward w
beatjump_4_backward Shift+W
beatjump_32_forward e
beatjump_32_backward Shift+E

pfl t
volume_toggle Ctrl+g
volume_up g
volume_down Shift+G
pregain_down Ctrl+Shift+%
pregain_up Ctrl+5

rate_temp_down a
rate_temp_up s
rate_perm_down Shift+D
rate_perm_up d
rate_temp_down_small Ctrl+a
rate_temp_up_small Ctrl+S
rate_perm_down_small Ctrl+Shift+D
rate_perm_up_small Ctrl+d

hotcue_1_activate 2
hotcue_2_activate 3
hotcue_3_activate 4
hotcue_1_clear Shift+@
hotcue_2_clear Shift+#
hotcue_3_clear Shift+$

reloop_toggle 1
loop_move_0.03125_forward Ctrl+1
loop_move_0.03125_backward Ctrl+Shift+!
beatloop_4_activate Ctrl+Shift+!
beatloop_8_activate Ctrl+Shift+@
beatloop_16_activate Ctrl+Shift+#
beatloop_32_activate Ctrl+Shift+$


[Channel2]
LoadSelectedTrack Shift+Right

play .
cue_default /
fwd i
back Shift+I
beatjump_0.03125_forward ctrl+i
beatjump_0.03125_backward ctrl+Shift+i
beatjump_4_forward o
beatjump_4_backward Shift+O
beatjump_32_forward p
beatjump_32_backward Shift+P

pfl y
volume_toggle Ctrl+h
volume_up h
volume_down Shift+H
pregain_down Ctrl+Shift+^
pregain_up Ctrl+6

rate_temp_down k
rate_temp_up l
rate_perm_down Shift+:
rate_perm_up ;
rate_temp_down_small Ctrl+k
rate_temp_up_small Ctrl+l
rate_perm_down_small Ctrl+Shift+:
rate_perm_up_small Ctrl+;

hotcue_1_activate 8
hotcue_2_activate 9
hotcue_3_activate 0
hotcue_1_clear Shift+*
hotcue_2_clear Shift+(
hotcue_3_clear Shift+)

reloop_toggle 7
loop_move_0.03125_forward Alt+6
loop_move_0.03125_backward Alt+Shift+^
beatloop_4_activate Ctrl+Shift+&
beatloop_8_activate Ctrl+Shift+(
beatloop_16_activate Ctrl+Shift+(
beatloop_32_activate Ctrl+Shift+)

